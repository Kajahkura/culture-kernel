ignore: []
schema: blinkhost/v1
modules:
- abi: blinkhost-wasi-1
  sdk: 1.1.0
  name: go-canary
  path: _server_islands/go-canary
  language: go
  entrypoint: main.go
- abi: blinkhost-wasi-1
  sdk: 1.1.0
  name: python-canary
  path: _server_islands/python-canary
  language: python
  entrypoint: main.py
- abi: blinkhost-wasi-1
  sdk: 1.1.0
  name: rust-canary
  path: _server_islands/rust-canary
  language: rust
  entrypoint: src/main.rs
preview:
  enabled: true
  database_mode: none
frontend:
  dev: npm run dev
  build: npm run build
  output: dist
  install: npm ci
  framework: react
  package_manager: npm
resources:
  secrets: []
  databases: []
application:
  root: graft-canary
